function icon(n,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[n]||icons.box}</svg>`}
function art(kind,label=''){const bagWeight=(label.match(/(\d+)\s*kg/)?.[1]||'25')+' kg';if(kind==='oil')return '<svg viewBox="0 0 100 135" aria-hidden="true"><path fill="#d6c082" d="M38 8h25v13H38z"/><path fill="#3c694e" d="M37 6h27v8H37z"/><path fill="#cfad55" d="M35 23q-15 15-15 32v62q0 10 10 10h43q10 0 10-10V55q0-17-16-32z"/><path fill="#e4c472" d="M30 36h36q7 12 7 23v51H30z"/><path fill="#f2e8c7" d="M21 56h61v42H21z"/><path fill="#3d6f4d" d="M24 61h55v31H24z"/><text x="51" y="74" text-anchor="middle" fill="#f9f2d9" font-family="Georgia" font-size="9">PALME</text><text x="51" y="86" text-anchor="middle" fill="#dbe5b9" font-family="Arial" font-size="7">Huile végétale</text><path d="M35 38v11" stroke="#f8e3a4" stroke-width="4" stroke-linecap="round"/></svg>';if(kind==='home')return '<svg viewBox="0 0 100 135" aria-hidden="true"><path fill="#d1dcca" d="m19 39 61-8 8 59-61 9z"/><path fill="#b7c9ac" d="m27 99-8-60 13 11 8 58z"/><path fill="#f1f0df" d="m32 50 48-6 6 42-48 6z"/><path fill="#71966d" d="m33 55 47-6 2 15-47 7z"/><text x="58" y="61" transform="rotate(-7 58 61)" text-anchor="middle" fill="white" font-family="Arial" font-size="7">SAVON DOUX</text><path fill="#a3bb94" d="m43 80 28-3 2 7-28 3z"/></svg>';return '<svg viewBox="0 0 100 135" aria-hidden="true"><path fill="#ded6b7" d="m23 12 54 0-3 13q11 24 12 82-1 15-10 19H25q-13-8-11-21 2-52 13-80z"/><path fill="#ece4c9" d="M28 27h44q8 24 10 73H19q3-47 9-73"/><path fill="#4e7653" d="M20 48h62v42H20z"/><path fill="#335e42" d="M20 86h62v7H20z"/><text x="51" y="64" text-anchor="middle" fill="#f5edd2" font-family="Georgia" font-size="12">Basmati</text><text x="51" y="78" text-anchor="middle" fill="#e1e7c3" font-family="Arial" font-size="7">RIZ LONG PARFUMÉ</text><path d="M30 17h43M29 22h43" stroke="#c2b697" stroke-width="2"/><text x="50" y="113" text-anchor="middle" fill="#7b8060" font-family="Arial" font-size="10">'+bagWeight+'</text></svg>'}
const products=[{id:1,family:'Riz',name:'Riz Basmati · sac 25 kg',ref:'P-0001',price:28000,stock:8,unit:'sacs',kind:'rice',spec:'Basmati · 25 kg'},{id:2,family:'Riz',name:'Riz Basmati · sac 5 kg',ref:'P-0002',price:6500,stock:3,unit:'sacs',kind:'rice',spec:'Basmati · 5 kg'},{id:3,family:'Riz',name:'Riz parfumé · sac 25 kg',ref:'P-0003',price:24500,stock:12,unit:'sacs',kind:'rice',spec:'Riz parfumé · 25 kg'},{id:4,family:'Huiles',name:'Huile de palme · 1 litre',ref:'P-0004',price:1200,stock:18,unit:'bouteilles',kind:'oil',spec:'Palme · bouteille 1 L'},{id:5,family:'Huiles',name:'Huile de palme · 5 litres',ref:'P-0005',price:5500,stock:2,unit:'bidons',kind:'oil',spec:'Palme · bidon 5 L'},{id:6,family:'Entretien',name:'Savon doux · 200 g',ref:'P-0006',price:400,stock:24,unit:'pièces',kind:'home',spec:'Savon · 200 g'}];
let pendingPhoto=null;
function productArt(p){return p.photoURL?`<img src="${p.photoURL}" alt="">`:art(p.kind,p.spec)}
let theme='atelier',page='home',query='',category='all',period=0,cart=[{id:1,qty:1},{id:4,qty:2}],toastTimer,returnFocus;
const money=n=>new Intl.NumberFormat('fr-FR').format(n),escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={home:'Vue d’ensemble',products:'Produits',stock:'Stock',sales:'Ventes'};
function btn(text,act,primary=false,ico=''){return `<button class="btn ${primary?'primary':''}" data-action="${act}">${ico?icon(ico,15):''}${text}</button>`}
function heading(eyebrow,title,sub,actions=''){return `<div class="eyebrow">${eyebrow}</div><div class="heading"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`}
function renderNav(){document.getElementById('nav').innerHTML=Object.entries(labels).map(([key,label])=>`<button data-page="${key}" class="${page===key?'active':''}" ${page===key?'aria-current="page"':''} title="${label}">${icon({home:'home',products:'box',stock:'stock',sales:'sale'}[key],20)}<span class="navtext">${label}</span>${key==='stock'?'<span class="navcount">2</span>':''}</button>`).join('');document.getElementById('crumb').textContent=labels[page]}
function barChart(){const days=['Ven.','Sam.','Dim.','Lun.','Mar.','Mer.','Aujourd’hui'],vals=[40,75,55,110,87,130,145];return `<svg class="chart" viewBox="0 0 500 205" role="img" aria-label="Exemple de ventes sur sept jours"><path d="M40 30H490M40 80H490M40 130H490" stroke="#e8ede3" stroke-dasharray="3 4"/><text x="0" y="34">150 k</text><text x="0" y="84">100 k</text><text x="0" y="134">50 k</text>${vals.map((v,i)=>`<rect x="${52+i*62}" y="${175-v}" width="29" height="${v}" rx="5" fill="${i===6?'#346f50':'#dbe6d0'}"><title>${days[i]} : ${money(v*1000)} FCFA, exemple</title></rect><text x="${67+i*62}" y="199" text-anchor="middle" style="font-size:${i===6?8:10}px">${days[i]}</text>`).join('')}</svg>`}
function dashboard(){const revenues=[145000,642000,2514000],counts=[12,63,241];return heading('Le quotidien, simplement',theme==='atelier'?'Bonjour Patrick.':'Le point sur votre boutique',theme==='atelier'?'Vos ventes et les produits à réapprovisionner.':'Vos ventes, vos stocks et les actions de la journée.',btn('Nouvelle vente','nav:sales',true,'plus'))+`<div class="period" aria-label="Période des statistiques">${['Aujourd’hui','7 derniers jours','Ce mois'].map((x,i)=>`<button data-period="${i}" class="${period===i?'on':''}" aria-pressed="${period===i}">${x}</button>`).join('')}</div><section class="metrics"><article class="card metric accent"><div class="label">Ventes encaissées</div><span class="metric-icon">${icon('trend',19)}</span><div class="value">${money(revenues[period])}<small>FCFA</small></div><div class="foot"><strong>${counts[period]} ventes payées</strong> · exemple de période</div></article><article class="card metric"><div class="label">Panier moyen</div><span class="metric-icon">${icon('receipt',19)}</span><div class="value">${money(Math.round(revenues[period]/counts[period]))}<small>FCFA</small></div><div class="foot">Par vente encaissée</div></article><article class="card metric"><div class="label">À surveiller</div><span class="metric-icon">${icon('alert',19)}</span><div class="value">2 <small>variantes en stock faible</small></div><div class="foot">Un coup d’œil avant la prochaine livraison</div></article></section><div class="dash-grid"><section class="card"><div class="cardhead"><h2>Vos ventes au fil des jours</h2><small>7 jours · exemple</small></div><div class="chart-note">Montants encaissés, en FCFA</div>${barChart()}</section><section class="card"><div class="cardhead"><h2>À réapprovisionner</h2><button class="btn ghost" data-action="nav:stock" aria-label="Voir le stock">${icon('arrow',17)}</button></div><div class="list">${[products[1],products[4]].map(p=>`<div class="item"><div class="thumb">${productArt(p)}</div><div><div class="item-name">${p.family==='Riz'?'Riz Basmati':'Huile de palme'}</div><div class="item-sub">${escapeText(p.spec)} · ${p.ref}</div></div><div class="item-right"><span class="badge">${p.stock} ${p.unit}</span></div></div>`).join('')}</div><div style="padding:0 22px 18px;font-size:10px;color:#929c89">Les variantes à prévoir pour votre réassort.</div></section></div><div class="lower"><section class="card quick"><h2>Une livraison arrive ?</h2><p>Retrouvez le bon produit et ajoutez<br>les quantités reçues en quelques gestes.</p>${btn('Recevoir du stock','receive',false,'plus')}</section><section class="card activity"><h2>Les derniers mouvements</h2><div class="activityline"><span class="smallcircle">${icon('check',13)}</span><span>Vente de Riz Basmati et d’huile de palme</span><time>10:42</time></div><div class="activityline"><span class="smallcircle">${icon('plus',13)}</span><span>Réception de 10 sacs de Riz Basmati</span><time>09:15</time></div></section></div>`}
function searchbar(placeholder,filter=true){return `<div class="filters"><label class="search">${icon('search',17)}<input type="search" id="search" aria-label="Rechercher un produit" placeholder="${placeholder}" value="${escapeText(query)}"></label>${filter?`<select id="category" aria-label="Filtrer par famille"><option value="all">Toutes les familles</option>${['Riz','Huiles','Entretien'].map(f=>`<option ${category===f?'selected':''}>${f}</option>`).join('')}</select>`:''}</div>`}
function filtered(){const q=query.toLocaleLowerCase('fr');return products.filter(p=>(category==='all'||p.family===category)&&[p.name,p.ref,p.spec].some(t=>t.toLocaleLowerCase('fr').includes(q)))}
function tableRows(items,stock=false){return `<div class="card table-wrap"><table class="table"><thead><tr><th>Produit / variante</th><th>Référence</th><th class="num">${stock?'Disponible':'Prix de vente'}</th><th>${stock?'État du stock':'Disponibilité'}</th></tr></thead><tbody>${items.map(p=>`<tr class="clickable" tabindex="0" data-product="${p.id}" aria-label="Ouvrir ${escapeText(p.name)}"><td><div style="display:flex;align-items:center;gap:13px"><div class="thumb">${productArt(p)}</div><div class="cell-title">${escapeText(p.name)}<div class="cell-sub">${escapeText(p.family)} · ${escapeText(p.spec)}</div></div></div></td><td style="color:#87927e;font-size:11px">${p.ref}</td><td class="num">${stock?`${p.stock} ${p.unit}`:`${money(p.price)} FCFA`}${stock?`<div class="stockbar ${p.stock<4?'low':''}" style="margin-left:auto"><span style="width:${Math.min(p.stock*4,100)}%"></span></div>`:''}</td><td><span class="badge ${p.stock<4?'':'ok'}">${p.stock<4?'Stock faible':stock?'Disponible':p.stock+' '+p.unit}</span></td></tr>`).join('')}</tbody></table>${items.length?'':'<div class="empty">Aucun produit ne correspond. Essayez un nom, une référence ou un poids.</div>'}</div>`}
function catalog(){const items=filtered();const families=[...new Set(items.map(p=>p.family))];return heading('Votre catalogue','Vos produits','Retrouvez la bonne variante, par nom, référence ou format.',btn('Importer un CSV','csv',false,'upload')+btn('Ajouter un produit','add',true,'plus'))+searchbar('Nom, référence, marque, poids…')+`<div class="catalog-summary">${products.length} variantes · ${new Set(products.map(p=>p.family)).size} familles</div><div id="catalogResults">${theme==='precision'?tableRows(items):`<div class="family-grid">${families.map(f=>{const group=items.filter(p=>p.family===f),kind=group[0].kind;return `<button class="family" data-family="${f}"><div class="family-art ${kind}">${productArt(group[0])}</div><div class="family-body"><div class="family-title">${f}${icon('arrow',19)}</div><p>${f==='Riz'?'Basmati, riz parfumé · plusieurs formats':f==='Huiles'?'Palme · bouteilles et bidons':'Les essentiels du quotidien'}</p><div class="family-bottom"><span>${group.length} variante${group.length>1?'s':''}</span><b>Voir les produits</b></div></div></button>`}).join('')}</div>${families.length?'':'<div class="empty">Aucun produit trouvé.</div>'}`}</div><div class="help-note">${icon('info',17)}Une famille rassemble les produits. Chaque variante garde sa référence, son prix et son stock.</div>`}
function stockPage(){return heading('Vos réserves','Votre stock','Les bonnes quantités, pour chaque produit et chaque format.',btn('Recevoir une livraison','receive',true,'plus'))+searchbar('Retrouver une variante ou une référence…')+tableRows(filtered(),true)}
function salesPage(){return heading('La caisse','Préparer une vente','Trouvez un produit, ajustez la quantité et vérifiez le panier.',btn('Historique des ventes','history',false,'receipt'))+`<div class="checkout"><section>${searchbar('Rechercher un produit à vendre…',false)}<div class="subtitle-row"><h2>Vos produits</h2><small>Prix de vente · FCFA</small></div><div class="pick-grid">${filtered().map(p=>`<button class="pick" data-cart-add="${p.id}" aria-label="Ajouter ${escapeText(p.name)} au panier"><div class="thumb">${productArt(p)}</div><h3>${escapeText(p.name)}</h3><p>${p.ref} · ${p.stock} ${p.unit} disponibles</p><div class="pick-price"><span>${money(p.price)} FCFA</span><span class="plus">${icon('plus',13)}</span></div></button>`).join('')}</div></section><section class="card basket"><div class="basket-head"><h2>Votre panier</h2><span>${cart.reduce((n,l)=>n+l.qty,0)} article(s)</span></div>${cart.length?cart.map(l=>{const p=products.find(p=>p.id===l.id);return `<div class="cartrow"><div class="carttop"><span>${escapeText(p.name)}</span><b>${money(p.price*l.qty)} F</b></div><div class="cartbottom"><span>${p.ref} · ${money(p.price)} F / unité</span><div class="stepper"><button data-step="${p.id}:-1" aria-label="Retirer une unité de ${escapeText(p.name)}">−</button><span>${l.qty}</span><button data-step="${p.id}:1" aria-label="Ajouter une unité de ${escapeText(p.name)}">+</button></div></div></div>`}).join(''):'<div class="empty">Votre panier attend sa première vente.<br>Choisissez un produit à gauche.</div>'}<div class="cart-total"><span>Total à payer</span><b>${money(cartTotal())} FCFA</b></div><button class="btn primary" data-action="checkout" ${cart.length?'':'disabled'}>${icon('check',16)}Encaisser en espèces${icon('arrow',16)}</button><p class="cart-info">Vérifiez le panier avant de confirmer.</p></section></div>`}
function cartTotal(){return cart.reduce((n,l)=>n+products.find(p=>p.id===l.id).price*l.qty,0)}
function render(){document.body.classList.toggle('precision',theme==='precision');renderNav();document.getElementById('main').innerHTML=({home:dashboard,products:catalog,stock:stockPage,sales:salesPage}[page])()+`<div class="demo-footer">${icon('info',12)}Maquette · données fictives. Les actions restent dans cette démonstration.</div>`;document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===theme)))}
function navigate(next){page=next;query='';category='all';render();window.scrollTo(0,0)}
function notify(s){clearTimeout(toastTimer);document.getElementById('toast').textContent=s;toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',4500)}
function showDialog(title,body,actions=''){returnFocus=document.activeElement;const d=document.getElementById('modal');d.innerHTML=`<h2 id="modalTitle">${title}</h2>${body}<div class="dialog-actions">${actions}<button class="btn" data-close>Fermer</button></div>`;d.showModal()}
function detail(id){const p=products.find(p=>p.id===id);showDialog(escapeText(p.name),`<div style="display:flex;justify-content:center;background:#f2f2e7;border-radius:10px;padding:12px">${productArt(p)}</div><div class="detail-line"><span>Référence</span><b>${p.ref}</b></div><div class="detail-line"><span>Prix de vente</span><b>${money(p.price)} FCFA</b></div><div class="detail-line"><span>En boutique</span><b>${p.stock} ${p.unit}</b></div><p>${escapeText(p.spec)} · ${escapeText(p.family)}<br>Une photo réelle du produit pourra remplacer cette illustration.</p>`)}
function family(name){showDialog(escapeText(name),`<p>Choisissez le format exact. Chaque variante possède son propre stock.</p>${products.filter(p=>p.family===name).map(p=>`<div class="detail-line"><span>${escapeText(p.name)}<small>${p.ref} · ${p.stock} ${p.unit}</small></span><button class="btn" data-product="${p.id}">${money(p.price)} F ${icon('arrow',13)}</button></div>`).join('')}`)}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-product]');if(!b)return;if(b.dataset.theme){theme=b.dataset.theme;render()}else if(b.dataset.page)navigate(b.dataset.page);else if(b.dataset.period!==undefined){period=Number(b.dataset.period);render()}else if(b.dataset.family)family(b.dataset.family);else if(b.dataset.product){const d=document.getElementById('modal');if(d.open)d.close();detail(Number(b.dataset.product))}else if(b.dataset.cartAdd){const p=products.find(p=>p.id===Number(b.dataset.cartAdd)),l=cart.find(l=>l.id===p.id);if((l?.qty||0)>=p.stock){notify('La quantité disponible est déjà dans le panier.');return}if(l)l.qty++;else cart.push({id:p.id,qty:1});render()}else if(b.dataset.step){const [id,delta]=b.dataset.step.split(':').map(Number),l=cart.find(l=>l.id===id),p=products.find(p=>p.id===id);if(l.qty+delta>p.stock){notify('Stock disponible atteint.');return}l.qty+=delta;cart=cart.filter(l=>l.qty>0);render()}else if(b.hasAttribute('data-close'))document.getElementById('modal').close();else if(b.dataset.action){const a=b.dataset.action;if(a.startsWith('nav:'))navigate(a.split(':')[1]);else if(a==='photo')document.getElementById('photoInput').click();else if(a==='add')showDialog('Ajouter un produit',`<p>Un formulaire court, avec les informations essentielles en premier.</p><form id="addForm"><div class="photo-picker"><div class="photo-preview" id="photoPreview">${icon('upload',24)}</div><div><b>Photo du produit · facultatif</b><input id="photoInput" type="file" accept="image/png,image/jpeg,image/webp" aria-label="Choisir une photo du produit" hidden><button type="button" class="btn" data-action="photo">Choisir une photo</button><span id="photoStatus" style="font-size:11px;display:block;margin-top:6px;color:#8a987f" aria-live="polite">PNG, JPEG ou WebP · 8 Mo maximum</span></div></div><label class="field">Famille · facultatif<input name="family" list="familyNames" maxlength="50" placeholder="Ex. Riz"><datalist id="familyNames"><option value="Riz"><option value="Huiles"><option value="Entretien"></datalist></label><label class="field">Nom du produit ou de la variante<input required name="name" maxlength="80" placeholder="Ex. Basmati · sac 10 kg"></label><div class="form-row"><label class="field">Prix de vente (FCFA)<input required name="price" type="number" min="0" step="1" placeholder="Ex. 12 000"></label><label class="field">Unité<select name="unit"><option value="pièces">Pièce</option><option value="sacs">Sac</option><option value="kg">Kilogramme</option><option value="litres">Litre</option></select></label></div><p>La référence sera créée automatiquement. Ajoutez les quantités reçues dans Stock.</p><button class="btn primary" type="submit">Ajouter à la maquette</button></form>`);else if(a==='receive'){navigate('stock');showDialog('Recevoir une livraison','<p>Dans la version finale, vous choisirez une variante, sa quantité et le motif. Le stock réel reste géré par Cella.</p><p>Cette maquette montre la présentation et la navigation uniquement.</p>')}else if(a==='checkout')showDialog('Vérifier la vente',`<p>Montant de cet exemple : <strong>${money(cartTotal())} FCFA</strong>.</p><p>Une confirmation explicite avant d’enregistrer la vente. Cette démonstration ne crée aucune vente réelle.</p>`,btn('Simuler la confirmation','simulate',true,'check'));else if(a==='simulate'){cart=[];document.getElementById('modal').close();render();notify('Simulation terminée. Aucune vente réelle n’a été enregistrée.')}else if(a==='history')showDialog('Historique des ventes','<p>La version Java propose déjà la liste des ventes et les détails des reçus. Le nouveau style conservera vos filtres et votre panier.</p>');else if(a==='csv')showDialog('Importer vos produits','<p>Choisir le fichier → vérifier les lignes → confirmer.</p><p>Le service d’import existant sera conservé. Cette maquette ne lit et ne modifie aucun fichier de votre boutique.</p>')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const position=e.target.selectionStart;render();const field=document.getElementById('search');field.focus();try{field.setSelectionRange(position,position)}catch{}}});document.addEventListener('change',e=>{if(e.target.id==='photoInput'){const f=e.target.files?.[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>8*1024*1024){document.getElementById('photoStatus').textContent='Choisissez une image PNG, JPEG ou WebP de moins de 8 Mo.';e.target.value='';return}if(pendingPhoto)URL.revokeObjectURL(pendingPhoto);pendingPhoto=URL.createObjectURL(f);document.getElementById('photoPreview').innerHTML=`<img src="${pendingPhoto}" alt="Aperçu de la photo choisie">`;document.getElementById('photoStatus').textContent=f.name;return}if(e.target.id==='category'){category=e.target.value;render()}});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr[data-product]'))detail(Number(e.target.dataset.product))});document.addEventListener('submit',e=>{if(e.target.id==='addForm'){e.preventDefault();const data=new FormData(e.target),name=String(data.get('name')).trim(),price=Number(data.get('price'));if(!name||!Number.isSafeInteger(price)||price<0)return;products.push({id:products.length+1,family:String(data.get('family')||'').trim()||'Sans famille',name,photoURL:pendingPhoto,ref:'P-'+String(products.length+1).padStart(4,'0'),price,stock:0,unit:String(data.get('unit')||'pièces'),kind:'home',spec:'Nouvelle variante'});pendingPhoto=null;document.getElementById('modal').close();navigate('products');notify('Produit ajouté à la maquette uniquement.')}});document.getElementById('modal').addEventListener('close',()=>{if(pendingPhoto){URL.revokeObjectURL(pendingPhoto);pendingPhoto=null}returnFocus?.focus()});document.getElementById('shopIcon').innerHTML=icon('store',19);render();
</script></body></html>
