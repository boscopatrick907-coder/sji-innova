name: Java build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (Linux)
        if: runner.os != 'Windows'
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd --batch-mode --no-transfer-progress clean verify
      - name: Check packaged application
        run: java "-Djava.awt.headless=true" -jar desktop/target/innova-desktop-0.1.0-SNAPSHOT.jar --smoke-test
      - name: Check packaged SQLite persistence
        run: |
          java -jar desktop/target/innova-desktop-0.1.0-SNAPSHOT.jar --product-demo "${{ runner.temp }}/cella-demo.db"
          java -jar desktop/target/innova-desktop-0.1.0-SNAPSHOT.jar --product-demo "${{ runner.temp }}/cella-demo.db"
