name: Java build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare Maven wrapper (Linux)
        if: runner.os != 'Windows'
        timeout-minutes: 3
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ./mvnw --version; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
      - name: Prepare Maven wrapper (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            .\mvnw.cmd --version
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 10 }
          }
          exit 1
      - name: Build and test (Linux)
        if: runner.os != 'Windows'
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd --batch-mode --no-transfer-progress clean verify
      - name: Check packaged application
        run: java "-Djava.awt.headless=true" -jar desktop/target/innova-desktop-0.1.0-SNAPSHOT.jar --smoke-test
      - name: Check packaged SQLite persistence
        run: |
          java -jar desktop/target/innova-desktop-0.1.0-SNAPSHOT.jar --product-demo "${{ runner.temp }}/cella-demo.db"
          java -jar desktop/target/innova-desktop-0.1.0-SNAPSHOT.jar --product-demo "${{ runner.temp }}/cella-demo.db"
      - name: Check packaged stock persistence and retry
        run: |
          java -cp desktop/target/innova-desktop-0.1.0-SNAPSHOT.jar cm.sji.innova.core.demo.StockDemo "${{ runner.temp }}/cella-stock-demo.db"
          java -cp desktop/target/innova-desktop-0.1.0-SNAPSHOT.jar cm.sji.innova.core.demo.StockDemo "${{ runner.temp }}/cella-stock-demo.db"
